name: Post to TikTok

# ~6:11 PM Sri Lanka (12:41 UTC, off-peak minute): sends every rendered video not yet sent to the TikTok inbox,
# so you can tap Post at each peak (morning video ~6:45 PM, evening video ~5:45 AM Sri Lanka).
on:
  schedule:
    - cron: "41 12 * * *"
    - cron: "47 13 * * *"   # backups: GitHub sometimes skips scheduled runs; already-sent videos are never sent twice
    - cron: "53 15 * * *"
  push:
    paths: [".github/kick/**"]
  workflow_dispatch:
    inputs:
      story:
        description: "Story name to post (default: everything not yet sent)"
        required: false

concurrency: tiktok

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      NTFY_TOPIC: tinytales-e609ad0ab2
    steps:
      - uses: actions/checkout@v4
      - name: Pick stories to send
        id: due
        run: |
          names="${{ github.event.inputs.story }}"
          [ -n "$names" ] || names=$(python3 scripts/due.py tiktok | tr '\n' ' ')
          echo "names=$names" >> "$GITHUB_OUTPUT"; echo "To send: ${names:-none}"
      - name: Send to TikTok
        if: steps.due.outputs.names != '' && env.TIKTOK_REFRESH_TOKEN != ''
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "story-bot"; git config user.email "story-bot@users.noreply.github.com"
          mkdir -p out
          for name in ${{ steps.due.outputs.names }}; do
            gh run download -R "$GITHUB_REPOSITORY" -n "$name" -D out
            : > "$GITHUB_OUTPUT.tt"
            GITHUB_OUTPUT="$GITHUB_OUTPUT.tt" python3 scripts/upload_tiktok.py "stories/$name.json" "out/$name.mp4"
            status=$(sed -n 's/^tiktok_status=//p' "$GITHUB_OUTPUT.tt")
            curl -s -H "Title: ✅ TikTok ready" -H "Tags: musical_note" -H "Click: https://www.tiktok.com/@tinytalesdailystories" -d "$name ($status)" "https://ntfy.sh/$NTFY_TOPIC" > /dev/null || true
            echo "| $(date +%F) | $name | tiktok: $status |" >> stories/PUBLISHED.md
            sleep 20
          done
          git add stories/PUBLISHED.md && git commit -m "Log TikTok sends [skip ci]" && (git pull --rebase -q || (git checkout --theirs stories/PUBLISHED.md 2>/dev/null; git add stories/PUBLISHED.md; GIT_EDITOR=true git rebase --continue)) && git push
      - name: Phone notification (failed)
        if: failure()
        run: |
          curl -s -H "Title: ❌ TikTok post failed" -H "Priority: high" -H "Click: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" -d "A TikTok send didn't go through. Tap to see the error." "https://ntfy.sh/$NTFY_TOPIC" > /dev/null || true

name: Post to YouTube (make video + upload)

# Renders every story added in a push (normally 2 a day: a morning and an evening slot)
# and schedules each on YouTube at its own "publish_at" time (Sri Lanka).
on:
  push:
    branches: [main]
    paths: ["stories/*.json"]
  workflow_dispatch:
    inputs:
      story:
        description: "Path of the story JSON to (re)publish, e.g. stories/2026-11-18-xyz.json"
        required: true

concurrency: publish

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      NTFY_TOPIC: tinytales-e609ad0ab2
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }

      - name: Find new stories
        id: story
        run: |
          if [ -n "${{ github.event.inputs.story }}" ]; then files="${{ github.event.inputs.story }}";
          elif git rev-parse -q --verify HEAD~1 >/dev/null; then
            files=$(git diff --no-renames --name-only --diff-filter=A HEAD~1 HEAD -- 'stories/*.json' | sort | head -2 | tr '\n' ' ')
          else files=""; fi
          set -- $files
          echo "count=$#" >> "$GITHUB_OUTPUT"
          echo "f1=${1:-}" >> "$GITHUB_OUTPUT"; echo "n1=$(basename "${1:-x}" .json)" >> "$GITHUB_OUTPUT"
          echo "f2=${2:-}" >> "$GITHUB_OUTPUT"; echo "n2=$(basename "${2:-x}" .json)" >> "$GITHUB_OUTPUT"
          echo "Stories: $files"

      - if: steps.story.outputs.count != '0'
        uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }

      - if: steps.story.outputs.count != '0'
        name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt

      - if: steps.story.outputs.count != '0'
        name: Cache voice model
        uses: actions/cache@v4
        with: { path: models, key: kokoro-v1.0 }

      - if: steps.story.outputs.count != '0'
        name: Download voice model
        run: |
          mkdir -p models
          [ -f models/kokoro.onnx ] || curl -sSL -o models/kokoro.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          [ -f models/voices.bin ]  || curl -sSL -o models/voices.bin  https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin

      - if: steps.story.outputs.f1 != ''
        name: Render video 1
        run: mkdir -p out && python storykit/storykit.py "${{ steps.story.outputs.f1 }}" "out/${{ steps.story.outputs.n1 }}.mp4"
      - if: steps.story.outputs.f1 != ''
        uses: actions/upload-artifact@v4
        with: { name: "${{ steps.story.outputs.n1 }}", path: "out/${{ steps.story.outputs.n1 }}.mp4", retention-days: 7 }

      - if: steps.story.outputs.f2 != ''
        name: Render video 2
        run: python storykit/storykit.py "${{ steps.story.outputs.f2 }}" "out/${{ steps.story.outputs.n2 }}.mp4"
      - if: steps.story.outputs.f2 != ''
        uses: actions/upload-artifact@v4
        with: { name: "${{ steps.story.outputs.n2 }}", path: "out/${{ steps.story.outputs.n2 }}.mp4", retention-days: 7 }

      - if: steps.story.outputs.count != '0' && env.YT_REFRESH_TOKEN != ''
        name: Upload to YouTube, notify, log
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          PUBLISH_TZ: "Asia/Colombo"
        run: |
          git config user.name "story-bot"; git config user.email "story-bot@users.noreply.github.com"
          for f in ${{ steps.story.outputs.f1 }} ${{ steps.story.outputs.f2 }}; do
            name=$(basename "$f" .json); export RESULTS_FILE=/tmp/yt_$name.json; rm -f "$RESULTS_FILE"
            python scripts/upload_youtube.py "$f" "out/$name.mp4"
            id=$(jq -r .id "$RESULTS_FILE"); at=$(jq -r .at "$RESULTS_FILE"); human=$(jq -r .at_human "$RESULTS_FILE"); title=$(jq -r .title "$RESULTS_FILE")
            curl -s -H "Title: ✅ YouTube Short uploaded" -H "Tags: tv" -H "Click: https://youtube.com/shorts/$id" \
              -d "$title
          Goes live $human (Sri Lanka)" "https://ntfy.sh/$NTFY_TOPIC" > /dev/null || true
            echo "| $(date +%F) | $name | https://youtube.com/shorts/$id | live $at |" >> stories/PUBLISHED.md
          done
          git add stories/PUBLISHED.md && git commit -m "Log uploads [skip ci]" && (git pull --rebase -q || (git checkout --theirs stories/PUBLISHED.md 2>/dev/null; git add stories/PUBLISHED.md; GIT_EDITOR=true git rebase --continue)) && git push

      - if: failure()
        name: Phone notification (failed)
        run: |
          curl -s -H "Title: ❌ YouTube upload failed" -H "Priority: high" -H "Click: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" -d "A video didn't render or upload. Tap to see the error." "https://ntfy.sh/$NTFY_TOPIC" > /dev/null || true

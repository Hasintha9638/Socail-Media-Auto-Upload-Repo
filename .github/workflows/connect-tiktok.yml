name: Connect TikTok

# One-time: exchanges the code shown on https://hasintha9638.github.io/tiktok-callback.html
# for a TikTok refresh token and saves it as the TIKTOK_REFRESH_TOKEN secret (never printed).
on:
  workflow_dispatch:
    inputs:
      code:
        description: "Code from the TikTok callback page (use within 5 minutes)"
        required: true

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - name: Exchange code and save refresh token
        env:
          CODE: ${{ github.event.inputs.code }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "::add-mask::$CODE"
          resp=$(curl -sS -X POST https://open.tiktokapis.com/v2/oauth/token/ \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "client_key=$TIKTOK_CLIENT_KEY" \
            --data-urlencode "client_secret=$TIKTOK_CLIENT_SECRET" \
            --data-urlencode "code=$CODE" \
            --data-urlencode "grant_type=authorization_code" \
            --data-urlencode "redirect_uri=https://hasintha9638.github.io/tiktok-callback.html")
          rt=$(echo "$resp" | jq -r '.refresh_token // empty')
          if [ -z "$rt" ]; then echo "TikTok said: $(echo "$resp" | jq -c '{error, error_description}')"; exit 1; fi
          echo "::add-mask::$rt"
          gh secret set TIKTOK_REFRESH_TOKEN -R "$GITHUB_REPOSITORY" --body "$rt"
          echo "Connected TikTok account (scopes: $(echo "$resp" | jq -r .scope)). Refresh token saved as a secret."

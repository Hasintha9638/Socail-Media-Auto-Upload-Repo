name: Post to Facebook

# Twice a day, just before each YouTube go-live (5:45 AM and 6:45 PM Sri Lanka), post the Reel that is due.
on:
  schedule:
    - cron: "11 0 * * *"    # ~5:41 AM Sri Lanka  (= ~7:11 PM New York)
    - cron: "11 13 * * *"   # ~6:41 PM Sri Lanka  (= ~8:11 AM New York)
    - cron: "43 1 * * *"    # backups: GitHub sometimes skips scheduled runs; a Reel is never posted twice
    - cron: "43 14 * * *"
  push:
    paths: [".github/kick/**"]
  workflow_dispatch:
    inputs:
      story:
        description: "Story name to post (default: whatever is due)"
        required: false

concurrency: facebook

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      NTFY_TOPIC: tinytales-e609ad0ab2
    steps:
      - uses: actions/checkout@v4
      - name: Pick due stories
        id: due
        run: |
          names="${{ github.event.inputs.story }}"
          [ -n "$names" ] || names=$(python3 scripts/due.py facebook --window-min 90 | tr '\n' ' ')
          names=$(echo $names)   # trim: an empty list must stay empty
          echo "names=$names" >> "$GITHUB_OUTPUT"; echo "Due: ${names:-none}"
      - name: Post Reels
        if: steps.due.outputs.names != '' && env.FB_PAGE_TOKEN != ''
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "story-bot"; git config user.email "story-bot@users.noreply.github.com"
          mkdir -p out
          for name in ${{ steps.due.outputs.names }}; do
            gh run download -R "$GITHUB_REPOSITORY" -n "$name" -D out
            : > "$GITHUB_OUTPUT.fb"
            GITHUB_OUTPUT="$GITHUB_OUTPUT.fb" python3 scripts/upload_facebook.py "stories/$name.json" "out/$name.mp4"
            link=$(sed -n 's/^facebook_link=//p' "$GITHUB_OUTPUT.fb")
            curl -s -H "Title: ✅ Facebook Reel posted" -H "Tags: blue_book" -H "Click: $link" -d "$name" "https://ntfy.sh/$NTFY_TOPIC" > /dev/null || true
            echo "| $(date +%F) | $name | facebook: $link |" >> stories/PUBLISHED.md
          done
          git add stories/PUBLISHED.md && git diff --cached --quiet && exit 0
          git commit -m "Log Facebook posts [skip ci]" && (git pull --rebase -q || (git checkout --theirs stories/PUBLISHED.md 2>/dev/null; git add stories/PUBLISHED.md; GIT_EDITOR=true git rebase --continue)) && git push
      - name: Phone notification (failed)
        if: failure()
        run: |
          curl -s -H "Title: ❌ Facebook post failed" -H "Priority: high" -H "Click: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" -d "A Facebook Reel didn't go through. Tap to see the error." "https://ntfy.sh/$NTFY_TOPIC" > /dev/null || true
